services:
  llm-wiki:
    build: .
    ports:
      - "${WIKI_PORT:-3050}:${WIKI_PORT:-3050}"
    volumes:
      - ${WIKI_VOLUME:-./wiki_data}:/wiki
      - ./config:/config/ro:ro
    environment:
      WIKI_ROOT: /wiki
      WIKI_CONFIG_DIR: /wiki/config
      WIKI_PORT: ${WIKI_PORT:-3050}
    restart: unless-stopped
