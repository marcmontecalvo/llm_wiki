services:
  llm-wiki:
    build: .
    image: llm_wiki:latest
    ports:
      - "${WIKI_PORT:-3050}:3050"
    volumes:
      - ${WIKI_VOLUME:-./wiki_system}:/wiki_system
      - ./config:/config/ro:ro
    environment:
      WIKI_ROOT: /wiki_system
      WIKI_CONFIG_DIR: /wiki_system/config
      # UI authentication (default — override via .env or env vars)
      WIKI_UI_USER: ${WIKI_UI_USER:-admin}
      WIKI_UI_PASSWORD: ${WIKI_UI_PASSWORD:-}
      # Feature flags (override daemon.yaml features block)
      WIKI_WEBUI_ENABLED: ${WIKI_WEBUI_ENABLED:-false}
      WIKI_TUI_ENABLED: ${WIKI_TUI_ENABLED:-false}
    restart: unless-stopped
