{% extends "base.html" %}
{% block content %}
<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
  <h2 id="page-title" style="margin-bottom:0;">Loading…</h2>
  <a class="btn" href="/ui/editor?page_id={{ page_id }}" style="height:32px;padding:6px 14px;font-size:0.8rem;">&#9998; Edit</a>
</div>
<div style="display:grid;grid-template-columns:1fr 360px;gap:24px;">
  <!-- Main: Content -->
  <div class="panel" style="margin-bottom:0;">
    <h3>Content</h3>
    <div id="page-content" class="muted">Loading page content…</div>
  </div>
  <!-- Side: Metadata -->
  <div>
    <div class="panel" style="margin-bottom:14px;">
      <h3>Metadata</h3>
      <div id="page-meta" class="muted">Loading…</div>
    </div>
    <div class="panel" style="margin-bottom:14px;">
      <h3>Connects To</h3>
      <div id="page-connects-to" class="muted">Loading…</div>
    </div>
    <div class="panel" style="margin-bottom:0;">
      <h3>Connected From</h3>
      <div id="page-connected-from" class="muted">Loading…</div>
    </div>
  </div>
</div>

<script>
const _uiUser = "{{ ui_user }}";
const _uiPass = "{{ ui_password }}";
const pageId = "{{ page_id }}";
function _auth() { return "Basic " + btoa(_uiUser + ":" + _uiPass); }
function esc(s) { return String(s ?? ""); }

async function loadPage() {
  try {
    var resp = await fetch("/ui/api/page/" + encodeURIComponent(pageId), {
      headers: { "Authorization": _auth() }
    });
    if (!resp.ok) {
      var resp2 = await fetch("/v1/pages/" + encodeURIComponent(pageId), {
        headers: { "Authorization": _auth() }
      });
      if (!resp2.ok) {
        document.getElementById("page-content").textContent = "Error " + resp2.status + ": page not found.";
        return;
      }
      var p = await resp2.json();
      p.connects_to = [];
      p.connected_from = [];
    } else {
      var p = await resp.json();
    }

    // Title
    document.getElementById("page-title").textContent = esc(p.title || p.page_id);

    // Content — styled block
    var contentEl = document.getElementById("page-content");
    if (p.content) {
      contentEl.innerHTML = '<pre style="white-space:pre-wrap;word-wrap:break-word;font-family:inherit;background:var(--hover);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-size:0.9rem;line-height:1.7;">' + esc(p.content) + '</pre>';
    } else {
      contentEl.innerHTML = '<p class="muted">No content available.</p>';
    }

    // Metadata
    var conf = p.confidence ?? 0;
    var authScore = p.authority_score ?? 0;
    var confStr = typeof conf === 'boolean' ? (conf ? '1.00' : '0.00') : Number(conf).toFixed(2);
    var authStr = Number(authScore).toFixed(2);
    var updatedAt = p.frontmatter?.updated_at || p.updated_at || "";
    var timeStr = updatedAt ? new Date(updatedAt).toLocaleString() : "—";

    var meta = document.getElementById("page-meta");
    meta.innerHTML =
      '<table style="width:100%;font-size:0.835rem;">' +
      '<tr><th style="width:90px;padding:6px 0 6px 0;">ID</th><td><code style="font-size:0.85em;">' + esc(p.page_id) + '</code></td></tr>' +
      '<tr><th>Domain</th><td><code>' + esc(p.domain) + '</code></td></tr>' +
      '<tr><th>Kind</th><td>' + esc(p.kind || "page") + '</td></tr>' +
      '<tr><th>Confidence</th><td><span class="' + (parseFloat(confStr) >= 0.7 ? 'conf-high' : (parseFloat(confStr) >= 0.4 ? 'conf-med' : 'conf-low')) + '" style="font-weight:500;">' + confStr + '</span>' +
      '<span class="conf-bar-wrap ' + (parseFloat(confStr) >= 0.7 ? 'conf-high' : (parseFloat(confStr) >= 0.4 ? 'conf-med' : 'conf-low')) + '"><span class="fill" style="width:' + (parseFloat(confStr) * 100) + '%;"></span></span></td></tr>' +
      '<tr><th>Authority</th><td><span style="font-weight:500;">' + authStr + '</span></td></tr>' +
      '<tr><th>Updated</th><td style="color:var(--muted);font-size:0.835rem;">' + esc(timeStr) + '</td></tr>' +
      '</table>';

    // Trust tags
    var trustTags = p.frontmatter?.trust_tags || [];
    if (trustTags.length > 0) {
      var tagHtml = trustTags.map(function(t) {
        return '<span class="trust-tag">' + esc(t) + '</span>';
      }).join("");
      meta.innerHTML +=
        '<div style="margin-top:10px;font-size:0.75rem;text-transform:uppercase;color:var(--muted);letter-spacing:0.04em;font-weight:600;">Trust Tags</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">' + tagHtml + '</div>';
    }

    // Sources
    var sources = p.frontmatter?.sources || [];
    if (sources.length > 0) {
      meta.innerHTML +=
        '<div style="margin-top:10px;font-size:0.75rem;text-transform:uppercase;color:var(--muted);letter-spacing:0.04em;font-weight:600;">Sources</div>' +
        '<ul style="font-size:0.835rem;padding-left:16px;margin-top:4px;">';
      sources.forEach(function(s) {
        meta.innerHTML += "<li><code>" + esc(s) + "</code></li>";
      });
      meta.innerHTML += "</ul>";
    }

    // Connects To
    var connectsTo = p.connects_to || [];
    var ctEl = document.getElementById("page-connects-to");
    ctEl.innerHTML = connectsTo.length > 0 ?
      '<ul style="font-size:0.835rem;padding-left:16px;margin:0;">' +
      connectsTo.map(function(l) { return "<li><code>" + esc(l.target || l.page_id || l) + "</code></li>"; }).join("") + "</ul>" :
      '<p class="muted" style="font-size:0.835rem;">No outgoing links</p>';

    // Connected From
    var connectedFrom = p.connected_from || [];
    var cfEl = document.getElementById("page-connected-from");
    cfEl.innerHTML = connectedFrom.length > 0 ?
      '<ul style="font-size:0.835rem;padding-left:16px;margin:0;">' +
      connectedFrom.map(function(l) { return "<li><code>" + esc(l) + "</code></li>"; }).join("") + "</ul>" :
      '<p class="muted" style="font-size:0.835rem;">No backlinks</p>';

  } catch (e) {
    document.getElementById("page-content").textContent = "Error: " + esc(e.message);
  }
}

loadPage();
</script>
{% endblock %}
