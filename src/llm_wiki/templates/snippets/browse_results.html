<!-- HTMX browse result table rows -->
{% for p in pages %}
<tr onclick="location.href='/ui/page/{{ p.page_id }}'" style="cursor:pointer;">
  <td><a class="nav-link" href="/ui/page/{{ p.page_id }}">{{ p.title or p.page_id }}</a></td>
  <td><code>{{ p.domain or "general" }}</code></td>
  <td>{{ p.kind or "page" }}</td>
  <td>{{ "%.2f"|format(p.confidence or 0) }}</td>
  <td>{{ p.updated_at or "" }}</td>
</tr>
{% else %}
<tr><td colspan="5" class="muted">No pages match the selected filters.</td></tr>
{% endfor %}
