{% extends "base.html" %}
{% block content %}
<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;">
  <h2 id="domain-title" style="margin-bottom:0;">Loading…</h2>
  <a class="btn" href="/ui/editor" style="height:32px;padding:6px 14px;font-size:0.8rem;">&#43; New Page</a>
</div>
<div id="domain-status" class="muted" style="font-size:0.835rem;margin-bottom:14px;"></div>

<div class="panels" id="domain-panels"></div>

<div class="panel" id="domain-pages-panel" style="margin-top:20px;">
  <h3>Pages in <span id="domain-pages-domain"></span></h3>
  <div id="domain-pages-list" class="muted">Loading…</div>
</div>

<script>
(function() {
  const _uiUser = "{{ ui_user }}";
  const _uiPass = "{{ ui_password }}";
  const domain = "{{ domain_id }}";
  document.getElementById("domain-title").textContent = domain;
  document.getElementById("domain-pages-domain").textContent = domain;

  function auth() { return "Basic " + btoa(_uiUser + ":" + _uiPass); }
  function esc(s) { return String(s ?? ""); }

  async function load() {
    const status = document.getElementById("domain-status");
    const panels = document.getElementById("domain-panels");
    const pagesList = document.getElementById("domain-pages-list");

    try {
      const [dashR, pagesR] = await Promise.all([
        fetch('/ui/api/dashboard-data', { headers: { 'Authorization': auth() } }),
        fetch('/v1/pages?limit=200&domain=' + encodeURIComponent(domain), { headers: { 'Authorization': auth() } }),
      ]);

      if (!dashR.ok) throw new Error(dashR.status);
      if (!pagesR.ok) throw new Error(pagesR.status);

      const d = await dashR.json();
      const pgData = await pagesR.json();

      const pages = (pgData.pages || []);
      status.textContent = domain + ' — ' + pages.length + ' pages';

      const foundDash = (d.domain_dashboards || []).find(function(dd) { return dd.domain === domain; });

      let html = '<div class="panel"><h3>Overview</h3><table style="width:100%;font-size:0.85rem;">';
      html += '<tr><th style="width:100px;">Pages</th><td style="font-size:1.1rem;font-weight:700;">' + (pages.length || 0) + '</td></tr>';

      if (foundDash) {
        html += '<tr><th>Low Confidence</th><td><span style="color:var(--red);font-weight:500;">' + (foundDash.low_confidence_count || 0) + '</span></td></tr>';
        html += '<tr><th>Stale</th><td><span style="color:var(--yellow);font-weight:500;">' + (foundDash.stale_count || 0) + '</span></td></tr>';
      } else {
        let lowConf = 0;
        for (const p of pages) {
          const c = p.confidence ?? 0;
          if (typeof c === 'boolean') c = c ? 1 : 0;
          if (parseFloat(c) < 0.5) lowConf++;
        }
        html += '<tr><th>Low Confidence</th><td><span style="color:var(--red);font-weight:500;">' + lowConf + '</span></td></tr>';
        html += '<tr><th>Stale</th><td><span style="color:var(--yellow);font-weight:500;">0</span></td></tr>';
      }

      const kindCount = {};
      for (const p of pages) {
        const k = p.kind || 'page';
        kindCount[k] = (kindCount[k] || 0) + 1;
      }
      const kindsHtml = Object.entries(kindCount).map(function(e) { return '<code>' + esc(e[0]) + ':</code> ' + e[1]; }).join(' ');
      html += '<tr><th>Kinds</th><td>' + (kindsHtml || '—') + '</td></tr>';
      html += '</table></div>';
      panels.innerHTML = html;

      if (!pages.length) {
        pagesList.innerHTML = '<p class="muted">No pages found in this domain.</p>';
        return;
      }

      let phtml = '<table style="width:100%;font-size:0.85rem;"><thead><tr><th>Title</th><th>Kind</th><th>Confidence</th><th>Updated</th></tr></thead><tbody>';
      for (const p of pages) {
        const c = p.confidence ?? 0;
        const confStr = typeof c === 'boolean' ? (c ? '1.00' : '0.00') : Number(c).toFixed(2);
        const confNum = parseFloat(confStr);
        const confClass = confNum >= 0.7 ? 'conf-high' : (confNum >= 0.4 ? 'conf-med' : 'conf-low');
        const confColorVar = confNum >= 0.7 ? 'var(--green)' : (confNum >= 0.4 ? 'var(--yellow)' : 'var(--red)');
        phtml += '<tr style="cursor:pointer;" onclick="location.href=\'/ui/page/' + encodeURIComponent(p.page_id) + '\'">'
          + '<td><a class="nav-link" href="/ui/page/' + encodeURIComponent(p.page_id) + '">' + esc(p.title || p.page_id) + '</a></td>'
          + '<td>' + esc(p.kind || 'page') + '</td>'
          + '<td><span class="' + confClass + '" style="font-weight:500;">' + confStr + '</span>'
          + '<span class="conf-bar-wrap ' + confClass + '"><span class="fill" style="width:' + (confNum * 100) + '%;"></span></span></td>'
          + '<td style="color:var(--muted);font-size:0.835rem;white-space:nowrap;">' + esc(p.updated_at || '') + '</td>'
          + '</tr>';
      }
      phtml += '</tbody></table>';
      pagesList.innerHTML = phtml;

    } catch (e) {
      status.textContent = 'Error: ' + esc(e.message);
      pagesList.textContent = 'Failed to load domain data.';
    }
  }

  load();
})();
</script>
{% endblock %}
