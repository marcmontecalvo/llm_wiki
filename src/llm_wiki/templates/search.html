{% extends "base.html" %}
{% block content %}
<h2>Search</h2>
<form id="search-form" style="margin-bottom:18px;">
  <input type="text" id="search-q" placeholder="&#128269;  Search the wiki..." style="width:100%;padding:12px 16px;min-height:48px;font-size:1rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel-bg);color:var(--fg);transition:border-color 0.15s,box-shadow 0.15s;" autofocus>
</form>
<div id="search-status" class="muted" style="font-size:0.835rem;margin-bottom:10px;"></div>
<div id="search-results" style="overflow-x:auto;">
  <table id="search-table" style="display:none;">
    <thead><tr><th style="width:45%">Title</th><th style="width:20%">Domain</th><th style="width:20%">Kind</th><th style="width:15%">Score</th></tr></thead>
    <tbody id="search-tbody"></tbody>
  </table>
</div>

<!-- Horizontal rules -->
<div id="page-detail"></div>

<script>
const _uiUser = "{{ ui_user }}";
const _uiPass = "{{ ui_password }}";
function _authHeader() {
  return "Basic " + btoa(_uiUser + ":" + _uiPass);
}
function escHtml(s) {
  if (s == null) return "";
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderTable(pages) {
  const tbody = document.getElementById('search-tbody');
  const table = document.getElementById('search-table');
  const status = document.getElementById('search-status');
  if (!pages.length) {
    table.style.display = 'none';
    status.textContent = 'No results found.';
    return;
  }
  table.style.display = '';
  status.textContent = pages.length + ' result' + (pages.length !== 1 ? 's' : '') + ' found';
  let html = '';
  for (const r of pages) {
    const score = r.score != null ? Number(r.score).toFixed(2) : '0.00';
    const confidence = r.confidence != null ? Number(r.confidence).toFixed(2) : '0.00';
    const title = r.title || r.page_id;
    html += '<tr onclick="showPageDetail(\'' + encodeURIComponent(r.page_id) + '\')" style="cursor:pointer;">'
      + '<td><a class="nav-link" href="/ui/page/' + encodeURIComponent(r.page_id) + '">' + escHtml(title) + '</a></td>'
      + '<td><code>' + escHtml(r.domain || 'general') + '</code></td>'
      + '<td>' + escHtml(r.kind || 'page') + '</td>'
      + '<td><span title="confidence: ' + confidence + '">' + score + '</span></td>'
      + '</tr>';
  }
  tbody.innerHTML = html;
}

let _searchTimeout;
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('search-form');
  if (!form) return;
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const q = document.getElementById('search-q').value.trim();
    if (!q) { renderTable([]); return; }
    clearTimeout(_searchTimeout);
    _searchTimeout = setTimeout(async () => {
      status.style.display = 'flex';
      status.classList.add('loading');
      status.textContent = '';
      try {
        const resp = await fetch('/ui/api/search-json?q=' + encodeURIComponent(q), {
          headers: { 'Authorization': _authHeader() }
        });
        if (!resp.ok) {
          document.getElementById('search-status').textContent = 'Search failed: ' + resp.status;
          return;
        }
        const data = await resp.json();
        renderTable(data.results || []);
      } catch(e) {
        document.getElementById('search-status').textContent = 'Error: ' + e.message;
      }
    }, 250);
  });
});

function showPageDetail(pageId) {
  window.location.href = '/ui/page/' + encodeURIComponent(pageId);
}
</script>
{% endblock %}
